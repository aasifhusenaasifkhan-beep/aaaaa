<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Post Details | Hindi Sub Studio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo">Hindi Sub <span>Studio</span></a>
        <a href="index.html" style="color:white; text-decoration:none; background:#333; padding:5px 15px; border-radius:5px;">Back to Home</a>
    </header>

    <div id="detailBox" style="color:white; text-align:center; padding: 50px;">Loading Post Details...</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
        import { getFirestore, doc, getDoc, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD5wcGP9DyOXQ_QbVLTr7t7ZbL3FSsNr_0",
            authDomain: "hindisubinganim.firebaseapp.com",
            projectId: "hindisubinganim",
            storageBucket: "hindisubinganim.firebasestorage.app",
            messagingSenderId: "40724495461",
            appId: "1:40724495461:web:d75a75cb6ac625a00c5a8c"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        const params = new URLSearchParams(window.location.search);
        const postId = params.get("id");

        async function loadDetail() {
            if(!postId) return document.getElementById("detailBox").innerHTML = "Error: Invalid ID";
            
            const postSnap = await getDoc(doc(db, "posts", postId));
            if(!postSnap.exists()) return document.getElementById("detailBox").innerHTML = "Post Not Found or Deleted";
            
            const post = postSnap.data();
            
            const epQuery = query(collection(db, "episodes"), where("postId", "==", postId));
            const epSnap = await getDocs(epQuery);
            let episodes = [];
            epSnap.forEach(d => episodes.push({id: d.id, ...d.data()}));
            
            episodes.sort((a,b) => parseFloat(a.epNum) - parseFloat(b.epNum));
            
            let epHtml = "";
            episodes.forEach(ep => {
                epHtml += `<a href="watch.html?epid=${ep.id}" class="ep-btn">Episode ${ep.epNum}</a>`;
            });
            if(epHtml === "") epHtml = "<p style='color:#aaa;'>No episodes uploaded yet.</p>";

            document.getElementById("detailBox").innerHTML = `
                <div class="detail-container">
                    <img src="${post.image}" class="detail-poster">
                    <div style="text-align: left;">
                        <h1 style="font-size:30px; color:white; margin-bottom:10px;">${post.name}</h1>
                        <div class="meta-tags">
                            <span>📁 ${post.category}</span>
                            <span>📅 ${post.releaseDate}</span>
                            <span>🏷️ ${post.genre}</span>
                        </div>
                        <p style="color:#aaa; line-height:1.6;">${post.story}</p>
                        <h3 style="margin: 25px 0 15px; color: var(--primary);">Episodes List</h3>
                        <div>${epHtml}</div>
                    </div>
                </div>
            `;
        }
        loadDetail();
    </script>
</body>
</html>
