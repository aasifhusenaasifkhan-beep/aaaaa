<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Watch Video | Hindi Sub Studio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo">Hindi Sub <span>Studio</span></a>
        <button onclick="history.back()" style="background:#333; color:white; padding:5px 15px; border:none; border-radius:5px; cursor:pointer;">Go Back</button>
    </header>

    <!-- Password Overlay -->
    <div id="password-overlay" class="pass-overlay">
        <h2 style="color: #e50914; margin-bottom:10px;">🔒 Video is Locked!</h2>
        <input type="text" id="passInput" placeholder="Enter Password Here" style="padding:10px; width:250px; text-align:center; border-radius:5px; border:none;">
        <button class="btn-action" id="unlockBtn" style="background:#e50914;" onclick="checkPassword()">Loading Data...</button>
        <a href="https://t.me/hindisubinganime" target="_blank" style="color: #0088cc; text-decoration:none; margin-top:10px;">👉 Get Password from Telegram</a>
    </div>

    <!-- Video & Download Box -->
    <div class="watch-container" id="watchBox" style="display: none;">
        <div class="video-wrapper" id="vidPlayer">
            <iframe id="liveFrame" src="" allowfullscreen></iframe>
        </div>
        <button class="btn-action" style="background:#333;" onclick="document.getElementById('vidPlayer').classList.toggle('zoomed')">🔍 Zoom In/Out</button>
        
        <div style="margin-top: 30px;">
            <button class="btn-action" style="background: linear-gradient(45deg, #FFD700, #FFA500); color: black;" onclick="premiumDownload()">👑 Premium Download</button>
            <button class="btn-action" style="background: #0088cc;" id="shortBtn" onclick="generateShortLink(this)">⬇️ Solve Shortener to Download</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
        import { getFirestore, doc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD5wcGP9DyOXQ_QbVLTr7t7ZbL3FSsNr_0",
            authDomain: "hindisubinganim.firebaseapp.com",
            projectId: "hindisubinganim",
            storageBucket: "hindisubinganim.firebasestorage.app",
            messagingSenderId: "40724495461",
            appId: "1:40724495461:web:d75a75cb6ac625a00c5a8c"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        const params = new URLSearchParams(window.location.search);
        const epId = params.get("epid");
        let episodeData = null;
        let globalPass = ""; 
        let shorteners = [];
        let isSettingsLoaded = false;

        async function initPage() {
            try {
                // 1. Fetch Admin Settings
                const setSnap = await getDoc(doc(db, "settings", "main"));
                if(setSnap.exists() && setSnap.data()){
                    globalPass = (setSnap.data().videoPassword || "").trim();
                    shorteners = setSnap.data().shorteners || [];
                }

                isSettingsLoaded = true;
                document.getElementById("unlockBtn").innerHTML = "Unlock Video";

                // 2. Password Check Logic
                if(globalPass === "") {
                    // Agar admin ne password nahi lagaya hai, direct open karo
                    unlockVideo();
                } else if(localStorage.getItem("site_vid_pass") === globalPass) {
                    // Agar user ne pehle se sahi password daala hua hai
                    unlockVideo();
                }

                // 3. Load Episode Video
                const epSnap = await getDoc(doc(db, "episodes", epId));
                if(epSnap.exists()){
                    episodeData = epSnap.data();
                    document.getElementById("liveFrame").src = episodeData.liveLink;
                }
            } catch(e){
                alert("Database load hone me problem aayi. Page refresh karein.");
            }
        }

        // On Click Check Password
        window.checkPassword = () => {
            if(!isSettingsLoaded) return alert("System loading, please wait 1 second...");

            let val = document.getElementById("passInput").value.trim();
            
            if(val === globalPass){
                localStorage.setItem("site_vid_pass", globalPass);
                unlockVideo();
            } else { 
                alert("❌ Incorrect Password! Dhyan se password dalein (Space wagera na ho)."); 
            }
        }

        function unlockVideo() {
            document.getElementById("password-overlay").style.display = "none";
            document.getElementById("watchBox").style.display = "block";
        }

        // --- PREMIUM VERIFICATION SYSTEM ---
        window.premiumDownload = async () => {
            let token = prompt("Enter your Premium Token (Given by Admin):");
            if(!token) return;

            try {
                const q = query(collection(db, "premium_users"), where("token", "==", token.trim()));
                const snap = await getDocs(q);
                
                if(snap.empty) {
                    return alert("❌ Invalid Token! Ye token database me nahi hai.");
                }

                let user = snap.docs[0].data();
                if(Date.now() > user.expiry) {
                    return alert("❌ Your Token has Expired! 28 days pure ho chuke hain.");
                }

                alert("✅ Premium Access Granted! Downloading...");
                window.open(episodeData.dlLink, "_blank");
            } catch(e) {
                alert("Server checking failed. Try again.");
            }
        }

        // --- SHORTENER LOGIC ---
        function makeUniqueUrl(original) {
            const dailyId = Math.floor(Date.now() / 86400000); 
            const separator = original.includes('?') ? '&' : '?';
            return original + separator + "asi_uid=" + dailyId;
        }

        window.generateShortLink = async (btn) => {
            if(!shorteners || shorteners.length === 0) return alert("Admin ne Shortener API add nahi ki hai!");
            btn.innerHTML = "Generating Link Please Wait...";
            
            let idx = parseInt(localStorage.getItem("shortIdx") || "0");
            let currentApi = shorteners[idx % shorteners.length];
            localStorage.setItem("shortIdx", idx + 1);

            const bypassedUniqueLink = makeUniqueUrl(episodeData.dlLink);
            const apiUrl = `${currentApi.url}?api=${currentApi.key}&url=${encodeURIComponent(bypassedUniqueLink)}&format=text`;

            try {
                const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(apiUrl)}`;
                const response = await fetch(proxyUrl);
                const textData = await response.text();
                let finalShortLink = null;

                if (textData && (textData.trim().startsWith("http://") || textData.trim().startsWith("https://"))) {
                    finalShortLink = textData.trim();
                }

                if (finalShortLink) {
                    const form = document.createElement('form');
                    form.method = "GET"; form.action = finalShortLink; form.target = "_blank";
                    document.body.appendChild(form); form.submit(); document.body.removeChild(form);
                } else { alert("Ad Network Error!"); }
            } catch(e) { alert("Generation Failed. Network Issue."); }
            btn.innerHTML = "⬇️ Solve Shortener to Download";
        }

        initPage();
    </script>
</body>
</html>
