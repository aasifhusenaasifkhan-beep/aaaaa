<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel - Hindi Sub Studio</title>
    <style>
        body { font-family: Arial; background: #111; color: white; padding: 20px; margin: 0; }
        #loginScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #111; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; }
        #loginScreen input { padding: 12px; margin: 10px 0; width: 280px; border-radius: 5px; border: none; font-size: 16px; text-align: center; background: #222; color: white; border: 1px solid #444;}
        #loginScreen button { background: #e50914; color: white; padding: 12px 20px; border: none; cursor: pointer; border-radius: 5px; width: 280px; font-weight: bold; font-size: 16px; margin-top: 10px;}
        #adminPanel { display: none; max-width: 800px; margin: auto;}
        .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #333; padding-bottom: 10px; margin-bottom: 20px;}
        .tab-btn { background: #333; color: white; padding: 10px 20px; border: none; cursor: pointer; margin-right: 5px; border-radius: 5px; font-weight: bold;}
        .tab-btn.active { background: #e50914; }
        .panel { display: none; background: #222; padding: 20px; margin-top: 15px; border-radius: 8px; border: 1px solid #333;}
        .panel.active { display: block; }
        input, textarea, select { width: 100%; padding: 12px; margin: 10px 0; background: #333; color: white; border: 1px solid #444; border-radius: 5px; box-sizing: border-box;}
        button.action-btn { background: #e50914; color: white; padding: 12px 20px; border: none; cursor: pointer; border-radius: 5px; width: 100%; font-weight: bold; margin-top: 10px; font-size: 15px;}
        button.action-btn:disabled { background: #555; cursor: not-allowed; }
        .list-item { display: flex; justify-content: space-between; background: #333; padding: 10px; margin: 5px 0; border-radius: 5px; align-items: center;}
        .del-btn { background: #ff4500; color: white; border: none; padding: 5px 15px; border-radius: 3px; cursor: pointer; font-weight: bold;}
        .img-box { background: #111; padding: 15px; border-radius: 8px; border: 1px dashed #555; margin-bottom: 10px;}
    </style>
</head>
<body>

    <div id="loginScreen">
        <h2 style="color: #e50914;">Admin Login</h2>
        <input type="email" id="adminEmail" placeholder="Enter Admin Email">
        <input type="password" id="adminPass" placeholder="Enter Password">
        <button id="loginBtn" onclick="loginAdmin()">Login</button>
    </div>

    <div id="adminPanel">
        <div class="header-bar">
            <h2 style="color:white; margin: 0;">Hindi Sub <span style="color:#e50914;">Admin</span></h2>
            <button onclick="logoutAdmin()" style="background:#555; color:white; padding:8px 15px; border:none; border-radius:5px; cursor:pointer;">Logout</button>
        </div>
        
        <div>
            <button class="tab-btn active" onclick="switchTab('addPost')">Add Post</button>
            <button class="tab-btn" onclick="switchTab('addEp')">Add Episode</button>
            <button class="tab-btn" onclick="switchTab('premium')">Premium Users</button>
            <button class="tab-btn" onclick="switchTab('manage')">Delete Data</button>
            <button class="tab-btn" onclick="switchTab('settings')">Settings</button>
        </div>

        <div id="addPost" class="panel active">
            <h3 style="color:#e50914; margin-top: 0;">Create New Post</h3>
            <div class="img-box">
                <label style="color:#ffc107;">Step 1: Poster Image</label><br>
                <input type="file" id="postImage" accept="image/*">
                <div style="text-align: center; color: #555;">-- OR --</div>
                <input type="text" id="postImageUrl" placeholder="Paste Direct Image URL">
            </div>
            
            <label style="color:#aaa;">Step 2: Post Details</label>
            <input type="text" id="postCat" placeholder="Category (e.g. Hindi Sub Anime, Series)">
            <input type="text" id="postName" placeholder="Post Name (e.g. Naruto)">
            <input type="text" id="postDate" placeholder="Release Year">
            <input type="text" id="postGenre" placeholder="Genre">
            <textarea id="postStory" rows="3" placeholder="Story Summary..."></textarea>
            <button class="action-btn" id="savePostBtn" onclick="savePost()">Save Post</button>
        </div>

        <div id="addEp" class="panel">
            <h3 style="color:#e50914; margin-top: 0;">Add Episode</h3>
            <input type="text" id="searchPost" placeholder="🔍 Search Post Name..." onkeyup="filterAdminPosts()" style="background:#111;">
            <select id="epPostSelect"><option>Loading Posts...</option></select>
            <input type="number" id="epNum" placeholder="Episode Number (e.g. 1)">
            <input type="text" id="epLive" placeholder="Live Video Link (Vidhide/Streamtape)">
            <input type="text" id="epDl" placeholder="Direct Download Link">
            <button class="action-btn" id="saveEpBtn" onclick="saveEpisode()">Save Episode</button>
        </div>

        <div id="premium" class="panel">
            <h3 style="color:#e50914; margin-top: 0;">Manage Premium Users</h3>
            <input type="text" id="premEmail" placeholder="User's Email or Name">
            <input type="text" id="premToken" placeholder="Create Unique Token (e.g. VIP-RAHUL-123)">
            <button class="action-btn" onclick="addPremiumUser()">Grant Premium Access</button>
            <h4 style="margin-top:20px;">Active Premium Users</h4>
            <div id="premList">Loading...</div>
        </div>

        <div id="manage" class="panel">
            <h3 style="color:#e50914; margin-top: 0;">Manage & Delete Posts</h3>
            <div id="postList">Loading...</div>
        </div>

        <div id="settings" class="panel">
            <h3 style="color:#e50914; margin-top: 0;">Site Settings</h3>
            <label>Video Unlock Password (For Users):</label>
            <input type="text" id="setPass" placeholder="e.g. Anime@123">
            <h4 style="margin-top:15px;">Shortener APIs</h4>
            <input type="text" id="s1url" placeholder="API 1 URL"><input type="text" id="s1key" placeholder="API 1 KEY">
            <input type="text" id="s2url" placeholder="API 2 URL"><input type="text" id="s2key" placeholder="API 2 KEY">
            <input type="text" id="s3url" placeholder="API 3 URL"><input type="text" id="s3key" placeholder="API 3 KEY">
            <button class="action-btn" onclick="saveSettings()">Save Settings</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, setDoc, getDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD5wcGP9DyOXQ_QbVLTr7t7ZbL3FSsNr_0",
            authDomain: "hindisubinganim.firebaseapp.com",
            projectId: "hindisubinganim",
            storageBucket: "hindisubinganim.firebasestorage.app",
            messagingSenderId: "40724495461",
            appId: "1:40724495461:web:d75a75cb6ac625a00c5a8c"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        let allAdminPosts = [];

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById("loginScreen").style.display = "none";
                document.getElementById("adminPanel").style.display = "block";
                loadPostsForSelect(); loadSettings(); loadPostsForManage(); loadPremiumUsers();
            } else {
                document.getElementById("loginScreen").style.display = "flex";
                document.getElementById("adminPanel").style.display = "none";
            }
        });

        window.loginAdmin = () => {
            let email = document.getElementById("adminEmail").value;
            let pass = document.getElementById("adminPass").value;
            signInWithEmailAndPassword(auth, email, pass).catch((error) => alert("Login Failed!"));
        }
        window.logoutAdmin = () => signOut(auth);
        
        window.switchTab = (id) => {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            event.target.classList.add('active');
        }

        window.savePost = async () => {
            let file = document.getElementById("postImage").files[0];
            let urlInput = document.getElementById("postImageUrl").value.trim();
            let name = document.getElementById("postName").value.trim();
            let cat = document.getElementById("postCat").value.trim();
            let btn = document.getElementById("savePostBtn");

            if(!file && urlInput === "") return alert("Image dalna zaroori hai!");
            if(name === "" || cat === "") return alert("Name aur Category dalna zaroori hai!");

            btn.innerHTML = "Saving Post..."; btn.disabled = true;
            let finalImgUrl = "";

            try {
                if(urlInput !== "") { finalImgUrl = urlInput; } 
                else if(file) {
                    const fd = new FormData(); fd.append("file", file); fd.append("upload_preset", "asi_anime_upload"); 
                    let res = await fetch("https://api.cloudinary.com/v1_1/dccbzyjtr/image/upload", { method: "POST", body: fd });
                    let data = await res.json(); 
                    if(data.error) throw new Error(data.error.message);
                    finalImgUrl = data.secure_url; 
                }

                await addDoc(collection(db, "posts"), {
                    category: cat, name: name, releaseDate: document.getElementById("postDate").value, 
                    genre: document.getElementById("postGenre").value, story: document.getElementById("postStory").value, 
                    image: finalImgUrl, timestamp: Date.now()
                });
                
                alert("Post Saved!"); 
                document.getElementById("postImage").value = "";
                document.getElementById("postImageUrl").value = ""; 
                document.getElementById("postName").value = "";
                loadPostsForSelect(); loadPostsForManage();
            } catch(e) { alert("Error: " + e.message); }
            btn.innerHTML = "Save Post"; btn.disabled = false;
        }

        async function loadPostsForSelect() {
            try {
                const snap = await getDocs(collection(db, "posts")); 
                allAdminPosts = []; snap.forEach(doc => allAdminPosts.push({id: doc.id, name: doc.data().name}));
                let html = ""; allAdminPosts.forEach(p => html += `<option value="${p.id}">${p.name}</option>`);
                document.getElementById("epPostSelect").innerHTML = html;
            } catch(e){}
        }

        window.filterAdminPosts = () => {
            let q = document.getElementById("searchPost").value.toLowerCase();
            let filtered = allAdminPosts.filter(p => p.name.toLowerCase().includes(q));
            let html = ""; filtered.forEach(p => html += `<option value="${p.id}">${p.name}</option>`);
            document.getElementById("epPostSelect").innerHTML = html || "<option>No posts found</option>";
        }

        window.saveEpisode = async () => {
            let pId = document.getElementById("epPostSelect").value;
            let epNum = document.getElementById("epNum").value;
            let liveLink = document.getElementById("epLive").value;
            let dlLink = document.getElementById("epDl").value;
            if(!epNum || !liveLink || !dlLink) return alert("Fill all details!");
            try {
                await addDoc(collection(db, "episodes"), { postId: pId, epNum: epNum, liveLink: liveLink, dlLink: dlLink }); 
                alert("Episode Added!");
                document.getElementById("epNum").value = ""; document.getElementById("epLive").value = ""; document.getElementById("epDl").value = "";
            } catch(e) { alert("Error adding episode!"); }
        }

        window.addPremiumUser = async () => {
            let email = document.getElementById("premEmail").value;
            let token = document.getElementById("premToken").value;
            if(!email || !token) return alert("Email aur Token bharein!");
            let expiry = Date.now() + (28 * 24 * 60 * 60 * 1000); 
            
            try {
                await addDoc(collection(db, "premium_users"), { email: email, token: token, expiry: expiry });
                alert("Premium User Added!"); 
                document.getElementById("premEmail").value = ""; document.getElementById("premToken").value = "";
                loadPremiumUsers();
            } catch(e){ alert("Error"); }
        }

        async function loadPremiumUsers() {
            try {
                const snap = await getDocs(collection(db, "premium_users"));
                let html = "";
                snap.forEach(d => {
                    let u = d.data();
                    let daysLeft = Math.ceil((u.expiry - Date.now()) / (1000 * 60 * 60 * 24));
                    let status = daysLeft > 0 ? `<span style="color:lime">${daysLeft} days left</span>` : `<span style="color:red">Expired</span>`;
                    html += `<div class="list-item"><span><b>${u.email}</b> (${u.token}) - ${status}</span><button class="del-btn" onclick="deletePremium('${d.id}')">Revoke</button></div>`;
                });
                document.getElementById("premList").innerHTML = html || "No users found.";
            } catch(e){}
        }
        
        window.deletePremium = async (id) => {
            if(confirm("Revoke this token?")) {
                await deleteDoc(doc(db, "premium_users", id)); alert("Access Revoked!"); loadPremiumUsers();
            }
        }

        async function loadPostsForManage() {
            try {
                const snap = await getDocs(collection(db, "posts")); let html = "";
                snap.forEach(d => { html += `<div class="list-item"><span>${d.data().name}</span> <button class="del-btn" onclick="deletePost('${d.id}')">Delete</button></div>`; });
                document.getElementById("postList").innerHTML = html;
            } catch(e){}
        }

        window.deletePost = async (id) => {
            if(confirm("Delete this post?")) {
                await deleteDoc(doc(db, "posts", id)); alert("Deleted"); loadPostsForManage(); loadPostsForSelect();
            }
        }

        window.saveSettings = async () => {
            let shorteners = [];
            if(document.getElementById("s1url").value) shorteners.push({url: document.getElementById("s1url").value, key: document.getElementById("s1key").value});
            if(document.getElementById("s2url").value) shorteners.push({url: document.getElementById("s2url").value, key: document.getElementById("s2key").value});
            if(document.getElementById("s3url").value) shorteners.push({url: document.getElementById("s3url").value, key: document.getElementById("s3key").value});
            try {
                await setDoc(doc(db, "settings", "main"), { videoPassword: document.getElementById("setPass").value, shorteners: shorteners });
                alert("Settings Updated!");
            } catch(e){}
        }

        async function loadSettings() {
            try {
                const snap = await getDoc(doc(db, "settings", "main"));
                if(snap.exists()) {
                    let d = snap.data(); document.getElementById("setPass").value = d.videoPassword || "";
                    if(d.shorteners && d.shorteners[0]) { document.getElementById("s1url").value = d.shorteners[0].url; document.getElementById("s1key").value = d.shorteners[0].key; }
                    if(d.shorteners && d.shorteners[1]) { document.getElementById("s2url").value = d.shorteners[1].url; document.getElementById("s2key").value = d.shorteners[1].key; }
                    if(d.shorteners && d.shorteners[2]) { document.getElementById("s3url").value = d.shorteners[2].url; document.getElementById("s3key").value = d.shorteners[2].key; }
                }
            } catch(e){}
        }
    </script>
</body>
</html>
