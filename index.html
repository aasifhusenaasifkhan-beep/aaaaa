<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hindi Sub Studio | Watch Free Anime, K-Drama & Series</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <header>
        <div class="header-left">
            <a href="index.html" class="logo">Hindi Sub <span>Studio</span></a>
        </div>
        
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search Series, Anime..." onkeyup="searchPosts()">
            
            <!-- Three Dots Menu -->
            <div class="dropdown">
                <button onclick="toggleDotsMenu()" class="dropbtn">⋮</button>
                <div id="dotMenu" class="dropdown-content">
                    <a href="javascript:void(0)" onclick="openAZ()"><i class="fas fa-sort-alpha-down"></i> A-Z List (0-9)</a>
                    <a href="https://t.me/hindisubanime_q" target="_blank"><i class="fas fa-users"></i> Telegram Group</a>
                    <a href="https://t.me/hindisubinganime" target="_blank"><i class="fas fa-bullhorn"></i> Telegram Channel</a>
                    <a href="javascript:void(0)" onclick="applyPremium()"><i class="fas fa-crown"></i> 28-Days Premium</a>
                </div>
            </div>
        </div>
    </header>

    <!-- A-Z Modal Popup -->
    <div id="azModal">
        <div class="az-modal-content">
            <span class="close-modal" onclick="closeAZ()">&times;</span>
            <h3>Directory (A-Z & 0-9)</h3>
            <div id="azButtonsBox"></div>
        </div>
    </div>

    <div class="anime-grid" id="postGrid">
        <h2 style="text-align: center; width: 100%; color: var(--primary);">Loading Content...</h2>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD5wcGP9DyOXQ_QbVLTr7t7ZbL3FSsNr_0",
            authDomain: "hindisubinganim.firebaseapp.com",
            projectId: "hindisubinganim",
            storageBucket: "hindisubinganim.firebasestorage.app",
            messagingSenderId: "40724495461",
            appId: "1:40724495461:web:d75a75cb6ac625a00c5a8c"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let allPosts = [];

        // Three Dots Menu Logic
        window.toggleDotsMenu = () => {
            document.getElementById("dotMenu").classList.toggle("show");
        }
        // Close dropdown if clicked outside
        window.onclick = function(event) {
            if (!event.target.matches('.dropbtn')) {
                var dropdowns = document.getElementsByClassName("dropdown-content");
                for (var i = 0; i < dropdowns.length; i++) {
                    var openDropdown = dropdowns[i];
                    if (openDropdown.classList.contains('show')) openDropdown.classList.remove('show');
                }
            }
        }

        // Premium Logic
        window.applyPremium = () => {
            let token = prompt("Enter Premium Access Token:");
            if(token) {
                let expiry = Date.now() + (28 * 24 * 60 * 60 * 1000); 
                localStorage.setItem("premium_valid_till", expiry);
                alert("Premium Activated for 28 Days! Direct Download Unlocked.");
            }
        }

        // A-Z Logic
        window.openAZ = () => { document.getElementById("azModal").style.display = "block"; }
        window.closeAZ = () => { document.getElementById("azModal").style.display = "none"; }
        
        const azDiv = document.getElementById("azButtonsBox");
        azDiv.innerHTML += `<button class="az-btn" onclick="filterAZ('ALL')">All</button>`;
        "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").forEach(l => {
            azDiv.innerHTML += `<button class="az-btn" onclick="filterAZ('${l}')">${l}</button>`;
        });

        window.filterAZ = (letter) => {
            closeAZ();
            if(letter === 'ALL') return displayPosts(allPosts);
            displayPosts(allPosts.filter(p => p.name.toUpperCase().startsWith(letter)));
        }

        // Load Posts
        async function loadPosts() {
            const snap = await getDocs(collection(db, "posts"));
            allPosts = [];
            snap.forEach(doc => allPosts.push({ id: doc.id, ...doc.data() }));
            allPosts.sort((a,b) => b.timestamp - a.timestamp);
            displayPosts(allPosts);
        }

        window.displayPosts = (data) => {
            const grid = document.getElementById("postGrid");
            grid.innerHTML = "";
            if(data.length === 0) return grid.innerHTML = "<h3 style='color:white;text-align:center;width:100%;'>No content found.</h3>";

            data.forEach(post => {
                grid.innerHTML += `
                    <div class="anime-card" onclick="window.location.href='detail.html?id=${post.id}'">
                        <div class="badge">${post.category}</div>
                        <img src="${post.image}" alt="${post.name}">
                        <div class="anime-info">
                            <h4>${post.name}</h4>
                            <span class="genre-tag">${post.genre}</span>
                        </div>
                    </div>
                `;
            });
        }

        window.searchPosts = () => {
            let val = document.getElementById("searchInput").value.toLowerCase();
            displayPosts(allPosts.filter(p => p.name.toLowerCase().includes(val)));
        }

        loadPosts();
    </script>
</body>
</html>
